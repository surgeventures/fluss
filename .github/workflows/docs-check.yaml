# This workflow is meant for checking broken links in the documentation.
name: Check Documentation
permissions:
  contents: read
on:
  pull_request:
    branches: [main, release-*, ci-*]
    paths:
      - 'website/**'
  push:
    branches: [main, release-*, ci-*]
    paths:
      - 'website/**'

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Generate versioned docs
        run: ./build_versioned_docs.sh
      - name: Setup blog content
        run: ./setup_blog.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test build website
        run: npm run build -- --no-minify