name: Check License
permissions:
  contents: read

on:
  push:
    paths-ignore:
      - 'fluss-rust/**'
      - 'website/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'fluss-rust/**'
      - 'website/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MVN_COMMON_OPTIONS: -U -B --no-transfer-progress
      MVN_BUILD_OUTPUT_FILE: "/tmp/mvn_build_output.out"
      MVN_VALIDATION_DIR: "/tmp/fluss-validation-deployment"

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Build
        run: |
          set -o pipefail

          ./mvnw clean deploy ${{ env.MVN_COMMON_OPTIONS }} -DskipTests \
            -DaltDeploymentRepository=validation_repository::default::file:${{ env.MVN_VALIDATION_DIR }} \
            | tee ${{ env.MVN_BUILD_OUTPUT_FILE }}

      - name: Check License
        run: |
          ./mvnw ${{ env.MVN_COMMON_OPTIONS }} exec:java@check-license -N \
            -Dexec.args="${{ env.MVN_BUILD_OUTPUT_FILE }} $(pwd) ${{ env.MVN_VALIDATION_DIR }}" \
            -Dlog4j.configurationFile=file://$(pwd)/tools/ci/fluss-ci-tools/src/main/resources/log4j2.properties
        env:
          MAVEN_OPTS: -Xmx4096m