name: Rust Build and Tests

on:
  push:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluss-rust

permissions:
  contents: read

jobs:
  build-and-unit-test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install protoc
        uses: step-security/setup-protoc@d23a2fbf8225f60169d10a2b16a023b0381508bb # v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust

      - name: Build
        run: cargo build --workspace --all-targets --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif

      - name: Unit Test
        run: cargo test --all-targets --workspace --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
