name: Rust Build and Tests

on:
  push:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluss-rust

permissions:
  contents: read

jobs:
  build-and-unit-test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0

      - name: Install protoc
        uses: step-security/setup-protoc@d23a2fbf8225f60169d10a2b16a023b0381508bb # v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
        with:
          workspaces: fluss-rust

      - name: Build
        run: cargo build --workspace --all-targets --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif

      - name: Unit Test
        run: cargo test --all-targets --workspace --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
